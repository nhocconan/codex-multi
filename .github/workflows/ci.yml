name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node dist/cli.js --version
      - name: Package smoke test
        if: matrix.os != 'windows-latest' || matrix.node == 22
        shell: bash
        run: |
          npm pack --silent
          PACKAGE_TARBALL="$(node -p "const p=require('./package.json'); p.name+'-'+p.version+'.tgz'")"
          TEMP_PROJECT="$(mktemp -d)"
          npm install --prefix "$TEMP_PROJECT" "$PWD/$PACKAGE_TARBALL"
          "$TEMP_PROJECT/node_modules/.bin/cpm" --version
          "$TEMP_PROJECT/node_modules/.bin/codex-multi" --version
          "$TEMP_PROJECT/node_modules/.bin/codex-multi" --help
