name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm >=11.5.1; Node 22 ships an older npm.
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm run verify
      - run: npm pack --dry-run
      - name: Verify release tag
        run: |
          EXPECTED_TAG="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$EXPECTED_TAG"
      - name: Publish package
        run: |
          PACKAGE_SPEC="$(node -p "const p=require('./package.json'); p.name+'@'+p.version")"
          if npm view "$PACKAGE_SPEC" version >/dev/null 2>&1; then
            echo "$PACKAGE_SPEC is already published"
            exit 0
          fi
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
